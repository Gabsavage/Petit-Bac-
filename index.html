<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petit Bac</title>
<meta name="theme-color" content="#C1401C">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Petit Bac">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Chargée sans bloquer le rendu (media="print" le temps du téléchargement) : en
     feuille de style classique, rien ne s'affiche tant qu'elle n'est pas arrivée,
     d'où un écran blanc puis toute l'animation du splash jouée d'un coup. -->
<link id="font-css" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --paper:#F6F1E4;--paper-raised:#FFFFFF;--surface-2:#EFE6D2;
  --line:#E1D6BC;--line-strong:#CBBB93;
  --ink:#201C15;--ink-soft:#7C7159;--invalid:#A89A78;
  --accent:#C1401C;--accent-ink:#FFF6EA;--accent-tint:rgba(193,64,28,.10);
  --accent-2:#E2A63A;--accent-2-ink:#2A1B02;
  --success:#2E6E4F;--success-tint:rgba(46,110,79,.12);
  --danger:#B23A2E;--danger-tint:rgba(178,58,46,.14);
  --gold:#B07D18;--silver:#77797F;--bronze:#A2602A;
  --gold-tint:rgba(176,125,24,.16);--silver-tint:rgba(119,121,127,.13);--bronze-tint:rgba(162,96,42,.13);
  --shadow-sm:0 1px 0 rgba(32,28,21,.05);
  --shadow-md:0 18px 40px rgba(32,28,21,.14);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17130E;--paper-raised:#221B12;--surface-2:#2B2216;
    --line:#3B301F;--line-strong:#4E3F27;
    --ink:#F4ECD9;--ink-soft:#B7A886;--invalid:#7C7052;
    --accent:#E4693D;--accent-ink:#241006;--accent-tint:rgba(228,105,61,.16);
    --accent-2:#EFBB58;--accent-2-ink:#2A1B02;
    --success:#5FBF92;--success-tint:rgba(95,191,146,.16);
    --danger:#FF7B62;--danger-tint:rgba(255,123,98,.16);
    --gold:#EFBB58;--silver:#C4C8CF;--bronze:#DB9057;
    --gold-tint:rgba(239,187,88,.17);--silver-tint:rgba(196,200,207,.13);--bronze-tint:rgba(219,144,87,.15);
    --shadow-sm:0 1px 0 rgba(0,0,0,.4);
    --shadow-md:0 22px 48px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#17130E;--paper-raised:#221B12;--surface-2:#2B2216;
  --line:#3B301F;--line-strong:#4E3F27;
  --ink:#F4ECD9;--ink-soft:#B7A886;--invalid:#7C7052;
  --accent:#E4693D;--accent-ink:#241006;--accent-tint:rgba(228,105,61,.16);
  --accent-2:#EFBB58;--accent-2-ink:#2A1B02;
  --success:#5FBF92;--success-tint:rgba(95,191,146,.16);
  --danger:#FF7B62;--danger-tint:rgba(255,123,98,.16);
  --gold:#EFBB58;--silver:#C4C8CF;--bronze:#DB9057;
  --gold-tint:rgba(239,187,88,.17);--silver-tint:rgba(196,200,207,.13);--bronze-tint:rgba(219,144,87,.15);
  --shadow-sm:0 1px 0 rgba(0,0,0,.4);
  --shadow-md:0 22px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{background-color:var(--paper);}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:20px 20px;color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.icon{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:-.15em;}
#app-shell{position:relative;height:100dvh;height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--paper);overflow:hidden;}
/* Fond « page de cahier ». Les lignes sont **dessinées** (dégradés répétés) et
   non photographiées : elles restent droites, se recolorent avec le thème, et
   surtout elles s'adaptent à n'importe quelle hauteur d'écran. Les griffonnages,
   eux, sont des masques détourés des images générées (`bg/d/`), posés un par un
   dans les bandes que l'UI laisse libres. C'est tout l'intérêt par rapport à une
   image de fond : une compo figée calée sur un écran de 844pt tombe à côté sur un
   téléphone plus haut, là où un dessin ancré « à 70px du bandeau » reste en place. */
/* Le calque est monté *pendant* le splash, pas après : ses masques sont des
   fichiers à part, et sans préchargement les dessins se posaient un par un une
   fois l'écran de lancement parti. `ready` est posée par `markDoodlesReady()`
   dès que les masques de l'écran sont décodés — le splash étant opaque, le
   fondu ne sert que de filet quand le plafond d'attente a sauté. */
.paper-doodles{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  opacity:0;transition:opacity .4s ease;
  background-image:
    linear-gradient(90deg, transparent 27px, var(--rule-red) 27px, var(--rule-red) 28.5px, transparent 28.5px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--rule-blue) 27px, var(--rule-blue) 28px);
  background-position:0 0, 0 60px;}
.paper-doodles.ready{opacity:1;}
.doodle{position:absolute;display:block;background-color:var(--doodle-ink);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-position:center;mask-position:center;}
:root{--rule-blue:rgba(106,142,181,.42);--rule-red:rgba(193,64,28,.32);--doodle-ink:rgba(36,64,143,.55);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--rule-blue:rgba(140,172,205,.17);--rule-red:rgba(228,105,61,.26);
    --doodle-ink:rgba(244,236,217,.34);}
}
:root[data-theme="dark"]{--rule-blue:rgba(140,172,205,.17);--rule-red:rgba(228,105,61,.26);
  --doodle-ink:rgba(244,236,217,.34);}
@media (min-width:560px){
  #app-shell{margin:22px auto;height:calc(100dvh - 44px);border-radius:20px;box-shadow:var(--shadow-md);border:1.5px solid var(--line);}
}
.app-bar{position:relative;z-index:1;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 16px) 18px 8px;}
/* flex:1 pour que le titre garde sa place quel que soit le nombre de boutons visibles :
   avec space-between seul, il partait à droite dès qu'il n'y avait que le bouton retour. */
.app-bar-title{flex:1;font-family:var(--font-display);font-weight:700;font-size:1.2rem;display:flex;align-items:center;color:var(--ink);}
.brand-icon{width:20px;height:20px;margin-right:4px;display:inline-flex;}
.brand-mark{width:100%;height:100%;display:block;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:8px;}
.conn-dot.hidden{display:none;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--paper-raised);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.icon-btn:active{transform:scale(.9);background:var(--surface-2);}
.icon-btn[hidden]{display:none;}
.icon-btn.small{width:30px;height:30px;}
.icon-btn.small .icon{width:14px;height:14px;}
.icon-btn.spinning{animation:spin .6s linear;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.section-heading-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0 8px;}
.section-heading-row .section-heading{margin:0;}
.scoreboard-strip{position:relative;z-index:1;flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:6px 18px 14px;-webkit-overflow-scrolling:touch;}
.scoreboard-strip:empty{display:none;}
.player-pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--paper-raised);border:1.5px solid var(--line-strong);
  border-radius:100px;padding:4px 12px 4px 4px;}
.player-pill.lead{border-color:var(--accent);background:var(--accent-tint);}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.74rem;flex-shrink:0;position:relative;border:1.5px solid var(--ink);box-shadow:1px 1px 0 var(--ink);}
.avatar.small{width:20px;height:20px;font-size:.6rem;border-width:1.25px;box-shadow:1px 1px 0 var(--ink);}
.avatar.big{width:60px;height:60px;font-size:1.6rem;position:relative;border-width:2px;box-shadow:2px 2px 0 var(--ink);}
.player-pill .name{font-size:.8rem;font-weight:600;}
.player-pill .score{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);}
.content{position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch;}
.bottom-bar{position:relative;z-index:1;flex:0 0 auto;padding:10px 18px calc(var(--safe-bottom) + 12px);}
.bottom-bar:empty{display:none;}
.cta{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:15px;
  font-family:var(--font-body);font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.cta .icon{width:19px;height:19px;}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
.cta:disabled{opacity:.5;box-shadow:none;border-color:var(--line-strong);background:var(--surface-2);color:var(--ink-soft);}
.cta.secondary{background:var(--paper-raised);color:var(--ink);border-color:var(--line-strong);box-shadow:none;}
.cta.secondary:active{transform:scale(.98);}
.cta.secondary.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.bottom-bar-stack{display:flex;flex-direction:column;gap:8px;}
.btn-link{background:none;border:none;color:var(--ink-soft);padding:8px;font-size:.85rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;}
.btn-link .icon{width:14px;height:14px;}
.section-heading{font-family:var(--font-display);font-size:.78rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);margin:10px 0 6px;font-weight:700;}
.muted{color:var(--ink-soft);}
.error{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:6px 0 0;font-weight:600;}
.field{width:100%;background:var(--paper-raised);border:1.5px solid var(--line-strong);border-radius:12px;padding:14px 16px;
  font-size:1rem;color:var(--ink);font-family:var(--font-body);margin-bottom:10px;}
.field:focus{outline:2px solid var(--accent);outline-offset:1px;}
textarea.field{resize:vertical;font-family:var(--font-mono);font-size:16px;line-height:1.6;}
.field-line{width:100%;background:none;border:none;border-bottom:2px solid var(--line-strong);border-radius:0;
  padding:10px 2px;font-family:var(--font-display);font-size:1.35rem;font-weight:600;color:var(--ink);text-align:center;}
.field-line::placeholder{color:var(--invalid);font-weight:500;}
.field-line:focus{outline:none;border-color:var(--accent);}
.players-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper-raised);border:1.5px solid var(--ink);
  border-radius:100px;padding:6px 13px;font-size:.82rem;font-weight:600;color:var(--ink);box-shadow:1.5px 1.5px 0 var(--ink);}
/* Emoji purement décoratif devant le nom d'une catégorie : légèrement plus gros
   que le texte, gardé hors de la police d'interface pour éviter les rendus bâtards. */
.chip-emoji{font-size:1rem;line-height:1;margin-left:-2px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;}
/* Bloc centré verticalement, avec un écart franc entre le logo et les boutons.
   La hauteur du logo dépend donc de ce qu'il y a en dessous (le bloc de stats
   est là ou non) : c'est sans conséquence, le splash mesure sa cible au moment
   de se caler plutôt que de supposer une position fixe. */
.home-screen{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:16px 0;}
.cover-hero{padding:0 2px;text-align:center;}
.tile-row{display:flex;justify-content:center;gap:7px;margin-bottom:8px;}
.tile{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:9px;
  font-family:var(--font-display);font-weight:700;font-size:1.5rem;background:var(--paper-raised);color:var(--ink);
  border:1.75px solid var(--ink);box-shadow:2.5px 2.5px 0 var(--ink);}
.tile-pts{position:absolute;right:3px;bottom:1px;font-family:var(--font-mono);font-size:.5rem;font-weight:700;color:var(--ink-soft);}
.tagline{font-family:var(--font-display);font-size:1.22rem;margin:26px 0 0;font-weight:700;color:var(--ink);}
.home-actions{display:flex;flex-direction:column;gap:11px;margin-top:clamp(48px,20vh,170px);}
.stats-row{display:flex;margin:34px 0 0;}
.stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat-value{font-family:var(--font-mono);font-weight:700;font-size:1.2rem;color:var(--ink);}
.stat-label{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
.public-games-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.public-game-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper-raised);
  border:1.5px solid var(--line-strong);border-radius:12px;padding:13px 15px;font-family:var(--font-body);
  font-size:.92rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;width:100%;}
.public-game-row:active{transform:scale(.98);}
.pg-count{display:inline-flex;align-items:center;gap:4px;color:var(--ink-soft);font-size:.76rem;font-family:var(--font-mono);font-weight:700;flex-shrink:0;}
.pg-count .icon{width:13px;height:13px;}
.join-hero{padding:16px 2px 4px;}
.join-hero h2{font-family:var(--font-display);font-size:1.5rem;margin:0 0 16px;text-align:center;font-weight:700;}
.avatar-preview{display:flex;justify-content:center;margin:2px 0 16px;}
.avatar-preview .avatar.big{font-size:1.9rem;}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px;}
.emoji-choice{aspect-ratio:1;border:1.5px solid var(--line-strong);border-radius:9px;background:var(--paper-raised);
  font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.emoji-choice.selected{border-color:var(--accent);background:var(--accent-tint);}
.color-row{display:flex;gap:10px;justify-content:center;margin-bottom:6px;flex-wrap:wrap;}
.color-choice{width:28px;height:28px;border-radius:50%;border:2px solid var(--paper-raised);box-shadow:0 0 0 1.5px var(--line-strong);cursor:pointer;}
.color-choice.selected{box-shadow:0 0 0 2px var(--ink);}
.ticket-card{background:var(--paper-raised);border:1.75px dashed var(--line-strong);border-radius:16px;padding:10px 14px 8px;text-align:center;}
/* Salle d'attente : les joueurs sont le sujet de l'écran, pas le QR. La grille
   est alignée à gauche et comporte toujours une case « + » : un salon qui se
   remplit, plutôt qu'un avatar seul flottant au milieu. */
.lobby-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px 8px;padding:4px 0 2px;}
.lobby-avatar{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
/* Réservé dans chaque cellule, badge ou pas : sinon la cellule de l'hôte est plus
   haute que les autres et décale toute la rangée suivante. */
.tag-slot{height:17px;display:flex;align-items:center;justify-content:center;}
.lobby-avatar[data-action]{cursor:pointer;}
.lobby-slot{background:none;border:none;padding:0;font:inherit;color:var(--ink-soft);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.lobby-slot .slot-ring{width:60px;height:60px;border-radius:50%;border:2px dashed var(--line-strong);
  display:flex;align-items:center;justify-content:center;background:var(--paper-raised);}
.lobby-slot .slot-ring .icon{width:22px;height:22px;}
.lobby-slot:active .slot-ring{transform:scale(.94);}
.lobby-slot .lobby-name{color:var(--ink-soft);font-weight:600;}
.count-pill{font-family:var(--font-mono);font-size:.72rem;font-weight:700;color:var(--ink-soft);
  border:1.5px solid var(--line-strong);border-radius:100px;padding:1px 8px;}
/* Les réglages de la partie en une ligne, cliquable : c'était invisible jusque-là,
   il fallait ouvrir la feuille pour savoir en combien de manches on jouait. */
.rule-row{display:flex;gap:8px;margin:12px 0 2px;}
/* Fond plein comme tout ce qui se touche dans l'app (.icon-btn, .cta.secondary,
   .field) : en `background:none` le papier réglé traversait et les pastilles se
   lisaient comme des étiquettes, alors qu'elles ouvrent les réglages. */
.rule-chip{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--paper-raised);
  border:1.5px solid var(--line-strong);border-radius:12px;padding:9px 6px;cursor:pointer;color:var(--ink);
  font-family:var(--font-body);min-width:0;}
.rule-chip .icon{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}
.rule-chip b{font-family:var(--font-mono);font-size:.9rem;font-weight:700;}
.rule-chip span{font-size:.72rem;color:var(--ink-soft);font-weight:600;}
.rule-chip:active{transform:scale(.98);background:var(--surface-2);}
/* Les catégories en liste alignée plutôt qu'en nuage de pastilles centrées :
   ça se lit comme la grille de jeu qu'on va remplir. */
.cat-list{background:var(--paper-raised);border:1.5px solid var(--line-strong);border-radius:14px;overflow:hidden;}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);}
.cat-row:first-child{border-top:none;}
.cat-row .cat-emoji{font-size:1.05rem;line-height:1;width:22px;text-align:center;flex-shrink:0;
  font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;}
.cat-row .cat-name{font-size:.86rem;font-weight:600;line-height:1.25;}
/* QR déplacé dans la feuille : en pleine largeur il se scanne mieux qu'à 100px,
   et il ne mange plus le haut de l'écran une fois tout le monde arrivé. */
.invite-qr{display:flex;justify-content:center;margin:4px auto 14px;}
.invite-qr img,.invite-qr canvas{border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);}
.lobby-name{font-size:.78rem;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.host-tag{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;color:var(--accent-2-ink);background:var(--accent-2);padding:2px 7px 2px 5px;border-radius:100px;}
.host-tag .icon{width:10px;height:10px;}
.hero{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px;}
.letter-badge{position:relative;width:88px;height:88px;border-radius:16px;background:var(--paper-raised);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;
  font-size:2.5rem;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);flex-shrink:0;
  animation:popIn .35s cubic-bezier(.34,1.56,.64,1);}
.letter-badge .tile-pts{right:7px;bottom:5px;font-size:.72rem;}
.letter-badge.small{width:62px;height:62px;font-size:1.75rem;border-radius:12px;border-width:1.75px;box-shadow:3px 3px 0 var(--ink);margin-bottom:2px;}
.letter-badge.small .tile-pts{right:5px;bottom:3px;font-size:.55rem;}
@keyframes popIn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
@media (prefers-reduced-motion: reduce){.letter-badge,.countdown-number.pulse,.drum-tile,.podium-spotlight{animation:none;}}
.play-screen{display:flex;flex-direction:column;height:100%;}
/* Remonté de 14px (padding-top retiré + marge négative) pour dégager la lettre
   et le minuteur de la pastille de score. `.answer-scroll` reprend exactement
   les mêmes 14px en padding-top : sa zone grandit d'autant vers le haut, donc
   la carte de réponses, centrée dedans, ne bouge pas d'un pixel. Si tu changes
   l'un des deux nombres, change l'autre. */
.play-header{display:flex;align-items:center;justify-content:center;gap:22px;padding:0 0 4px;
  margin-top:-4px;flex:0 0 auto;}
.play-status{width:88px;height:88px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;color:var(--ink-soft);font-size:.78rem;line-height:1.3;text-align:center;}
.play-status .icon{width:26px;height:26px;color:var(--success);}
/* La carte est centrée dans l'espace restant, mais avec une bande réservée en bas :
   un centrage plein ne laisse que 40px sous elle sur un écran de 844, et les
   griffonnages n'ont plus où aller. `safe center` et pas `center` : quand les
   catégories débordent, un centrage normal rognerait le haut de la liste et le
   rendrait inatteignable au défilement. */
.answer-scroll{flex:1 1 auto;overflow-y:auto;min-height:0;padding-top:14px;padding-bottom:44px;
  display:flex;flex-direction:column;justify-content:safe center;}
.timer-ring{position:relative;width:88px;height:88px;flex-shrink:0;}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:326.7;
  transition:stroke-dashoffset .25s linear,stroke .2s;}
.ring-fg.danger{stroke:var(--danger);}
.timer-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:1.2rem;font-weight:700;}
.section-title{font-family:var(--font-display);font-size:1.15rem;text-align:center;margin:6px 0 4px;font-weight:700;}
.countdown-hero{padding:36px 0;}
.countdown-stage{width:132px;height:132px;margin:14px auto 0;border-radius:20px;border:2.25px solid var(--ink);
  background:var(--paper-raised);display:flex;align-items:center;justify-content:center;box-shadow:5px 5px 0 var(--ink);}
.countdown-number{font-family:var(--font-display);font-size:3.6rem;font-weight:700;color:var(--ink);line-height:1;}
.countdown-number.pulse{animation:popIn .3s cubic-bezier(.34,1.56,.64,1);}
.answer-list{display:flex;flex-direction:column;margin-top:8px;border-radius:14px;overflow:hidden;
  background:var(--paper-raised);border:1.5px solid var(--line-strong);}
.answer-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);}
.answer-row:last-child{border-bottom:none;}
.answer-row .cat-label{flex:0 0 38%;font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}
.answer-row input{flex:1;border:none;background:transparent;font-size:1.05rem;color:var(--ink);font-weight:600;
  font-family:var(--font-body);padding:5px 0;min-width:0;}
.answer-row input:focus{outline:none;}
.answer-row input:disabled{color:var(--ink-soft);}
.mvp-banner{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-family:var(--font-display);
  font-weight:700;font-size:1rem;color:var(--accent-2-ink);background:var(--accent-2);border:1.75px solid var(--ink);
  border-radius:12px;padding:11px 16px;margin:0 0 16px;}
.mvp-banner .icon{width:19px;height:19px;flex-shrink:0;}
.hurry-banner{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--danger);font-weight:700;
  font-family:var(--font-body);font-size:.92rem;margin:12px 0 0;text-align:center;}
.hurry-banner .icon{width:16px;height:16px;}
.reveal-card{background:var(--paper-raised);border:1.5px solid var(--line-strong);border-radius:14px;padding:15px 15px 12px;margin-bottom:12px;}
.reveal-card h3{font-family:var(--font-display);font-size:1.25rem;margin:0 0 12px;font-weight:700;text-align:center;}
.review-progress{text-align:center;font-family:var(--font-mono);font-size:.76rem;color:var(--ink-soft);margin:0 0 6px;}
.cat-dots{display:flex;justify-content:center;gap:5px;margin:2px 0 10px;}
.cat-dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);transition:all .2s;}
.cat-dot.current{background:var(--accent);width:16px;border-radius:4px;}
.cat-dot.done{background:var(--ink-soft);}
.review-block{padding:11px 0;border-bottom:1px solid var(--line);}
.review-block:last-child{border-bottom:none;}
.review-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.review-who{flex:1;font-size:.82rem;font-weight:700;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.review-word{margin:0 0 9px;font-weight:700;font-size:1.08rem;word-break:break-word;}
.review-word.empty{color:var(--invalid);font-style:italic;font-weight:500;}
.review-word.refused{text-decoration:line-through;color:var(--invalid);}
.review-note{font-size:.76rem;font-weight:600;font-style:italic;color:var(--invalid);}
.letter-warn{width:14px;height:14px;color:var(--accent-2-ink);flex-shrink:0;}
.review-tally{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);white-space:nowrap;}
.review-tally .icon{width:12px;height:12px;}
.review-pts-badge{font-family:var(--font-mono);font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:100px;
  background:var(--surface-2);color:var(--ink-soft);}
.review-pts-badge.pts-2{background:var(--success-tint);color:var(--success);}
.review-pts-badge.pts-1{background:var(--accent-2);color:var(--accent-2-ink);}
.vote-row{display:flex;gap:8px;}
.vote-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:11px;
  border:1.5px solid var(--line-strong);background:var(--paper-raised);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink-soft);}
.vote-btn .icon{width:15px;height:15px;}
.vote-btn.active-yes{background:var(--success-tint);border-color:var(--success);color:var(--success);}
.vote-btn.active-no{background:var(--danger-tint);border-color:var(--danger);color:var(--danger);}
.drumroll{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;}
.drum-tiles{display:flex;gap:10px;margin:20px 0 16px;}
.drum-tile{width:52px;height:52px;font-size:1.7rem;color:var(--ink-soft);
  animation:drumBounce .36s ease-in-out infinite alternate;}
@keyframes drumBounce{from{transform:translateY(0) rotate(-2deg);}to{transform:translateY(-13px) rotate(2deg);}}
.drum-caption{font-family:var(--font-mono);font-size:.8rem;letter-spacing:.04em;color:var(--ink-soft);margin:0;}
.fx-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:45;}
.splash{position:absolute;inset:0;z-index:60;background:var(--paper);
  transition:opacity .45s ease,visibility .45s ease;}
.splash.hidden{opacity:0;visibility:hidden;pointer-events:none;}
/* Centré par défaut ; le JS le recale sur la position réelle du logo de l'accueil. */
.splash-block{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;}
/* Les tuiles restent invisibles tant que le JS n'a pas posé .go (une fois la police
   prête) : sinon les délais s'écoulent pendant le chargement et tout apparaît d'un bloc. */
.splash-tile{width:46px;height:46px;font-size:1.5rem;opacity:0;}
.splash.go .splash-tile{animation:tileDrop .52s cubic-bezier(.2,1.3,.45,1) calc(var(--i) * .07s) forwards;}
@keyframes tileDrop{
  0%{opacity:0;transform:translateY(-30px) scale(.8) rotate(0deg);}
  55%{opacity:1;}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(var(--rot));}
}
.splash-by{margin:26px 0 0;font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-soft);opacity:0;}
.splash.go .splash-by{animation:fadeInSoft .5s ease .72s forwards;}
@keyframes fadeInSoft{to{opacity:.7;}}
.tile-loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 0;}
.tile-loader-wrap.full{height:100%;padding:0;}
.tile-loader{display:flex;gap:7px;}
.loader-tile{width:14px;height:14px;border-radius:4px;background:var(--paper-raised);border:1.5px solid var(--ink);
  box-shadow:1.5px 1.5px 0 var(--ink);animation:loaderHop .5s ease-in-out infinite alternate;}
.loader-tile:nth-child(2){animation-delay:.14s;}
.loader-tile:nth-child(3){animation-delay:.28s;}
@keyframes loaderHop{from{transform:translateY(0);}to{transform:translateY(-8px);}}
.loader-label{margin:16px 0 0;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.04em;color:var(--ink-soft);}
@media (prefers-reduced-motion: reduce){
  .paper-doodles{transition:none;}
  .loader-tile{animation:none;}
  .splash.go .splash-tile,.splash.go .splash-by{animation:none;}
  .splash.go .splash-tile{opacity:1;transform:rotate(var(--rot));}
  .splash.go .splash-by{opacity:.7;}
}
.confetti{position:absolute;top:-18px;border-radius:2px;
  animation-name:confettiFall;animation-timing-function:linear;animation-fill-mode:forwards;}
@keyframes confettiFall{
  0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg);}
  100%{opacity:0;transform:translate3d(var(--drift),108vh,0) rotate(var(--rot));}
}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0 10px;}
.podium-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:98px;}
.podium-step > .avatar,.podium-step > .podium-name,.podium-step > .podium-score,.podium-step > .podium-block{position:relative;z-index:1;}
.podium-spotlight{position:absolute;left:50%;top:-18px;width:160px;height:210px;transform:translateX(-50%);
  transform-origin:top center;
  background:linear-gradient(to bottom,rgba(226,166,58,.62),rgba(226,166,58,.12) 72%,rgba(226,166,58,0));
  clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);z-index:0;pointer-events:none;
  animation:spotlightPulse 2.6s ease-in-out infinite alternate;}
.podium-spotlight.lights-on{animation:spotOn .45s ease var(--d) both,
  spotlightPulse 2.6s ease-in-out calc(var(--d) + .45s) infinite alternate;}
.podium-step.p0 .avatar.big{box-shadow:2px 2px 0 var(--ink),0 0 0 5px rgba(226,166,58,.32);}
@keyframes spotOn{from{opacity:0;transform:translateX(-50%) scaleY(.35);}to{opacity:1;transform:translateX(-50%) scaleY(1);}}
@keyframes spotlightPulse{from{opacity:1;}to{opacity:.72;}}
.pod-step-in{animation:podRise .42s cubic-bezier(.2,1.25,.5,1) var(--d) both;}
@keyframes podRise{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
.pod-fade-in{animation:podFade .42s ease var(--d) both;}
@keyframes podFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .pod-step-in,.pod-fade-in,.podium-spotlight.lights-on{animation:none;}
}
.podium-step.empty{visibility:hidden;}
.podium-step.p0{order:2;}
.podium-step.p1{order:1;}
.podium-step.p2{order:3;}
.podium-block{width:100%;border-radius:10px 10px 0 0;border:1.75px solid var(--ink);border-bottom:none;
  display:flex;align-items:flex-start;justify-content:center;padding-top:10px;
  font-family:var(--font-display);font-weight:700;font-size:1.5rem;color:var(--ink);background:var(--paper-raised);}
/* Chiffres or / argent / bronze. Les piédestaux ne portent qu'une teinte légère du
   même métal : en aplat, le 1er écrasait son propre chiffre doré et le faisceau
   du projecteur, lui aussi dans les tons moutarde. */
.podium-block.rank-1{height:88px;background:var(--gold-tint);color:var(--gold);}
.podium-block.rank-2{height:64px;background:var(--silver-tint);color:var(--silver);}
.podium-block.rank-3{height:48px;background:var(--bronze-tint);color:var(--bronze);}
.podium-name{font-size:.8rem;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.podium-score{font-family:var(--font-mono);font-size:.85rem;color:var(--ink-soft);}
.leaderboard-list{display:flex;flex-direction:column;gap:6px;margin-top:16px;}
.leaderboard-row{display:flex;align-items:center;gap:10px;background:var(--paper-raised);border:1.5px solid var(--line-strong);
  border-radius:11px;padding:9px 13px;}
.lb-rank{font-family:var(--font-mono);color:var(--ink-soft);width:20px;text-align:center;font-size:.85rem;font-weight:700;}
.lb-name{flex:1;font-size:.9rem;font-weight:600;}
.lb-score{font-family:var(--font-mono);font-size:.85rem;color:var(--ink-soft);}
.legend{font-size:.78rem;text-align:center;margin:8px 0 10px;color:var(--ink-soft);}
.status-toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--ink);color:var(--paper);
  padding:9px 18px;border-radius:100px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis;}
.status-toast.show{opacity:1;transform:translate(-50%,0);}
.sheet-backdrop{position:absolute;inset:0;background:rgba(20,16,10,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;}
.sheet-backdrop.open{opacity:1;pointer-events:auto;}
.bottom-sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(100%);background:var(--paper-raised);
  border-radius:20px 20px 0 0;padding:8px 20px calc(var(--safe-bottom) + 22px);
  transition:transform .28s cubic-bezier(.32,.72,0,1);z-index:41;max-height:78%;overflow-y:auto;
  box-shadow:0 -14px 32px rgba(20,16,10,.18);border-top:1.5px solid var(--line-strong);}
.bottom-sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:100px;margin:6px auto 14px;}
.sheet-title{font-family:var(--font-display);font-size:1.15rem;margin:0 0 4px;font-weight:700;}
/* Avatar en guise de bouton : il occupe toute la pastille, sans bordure en double. */
.icon-btn.has-avatar{border-color:transparent;background:none;}
.icon-btn.has-avatar .avatar.small{width:30px;height:30px;font-size:.92rem;}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
.sheet-links{display:flex;flex-direction:column;gap:4px;text-align:center;margin-top:22px;}
.duration-choices{display:flex;gap:8px;margin-top:8px;}
.duration-choices .cta.secondary{width:auto;flex:1;padding:10px;font-size:.88rem;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>

    <div id="splash-block" class="splash-block">

        <span class="tile splash-tile" style="--i:7;--rot:-2deg">C<b class="tile-pts">3</b></span>

</div>

const CATEGORIES_PER_GAME = 8;

function esc(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

function normalize(str){
  return String(str||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function keyFor(name){
  const cleaned = String(name||'').split('').filter(function(ch){
    const code = ch.charCodeAt(0);
    if (code <= 31 || code === 127) return false;
    return '.#$[]/'.indexOf(ch) === -1;
  }).join('').trim();
  return 'p_' + (cleaned || Math.random().toString(36).slice(2,8));

function recentLetters(s){

/* Tirage des catégories à la création d'une partie. On mélange chaque famille,
   puis on fait un tour de table (une catégorie par famille, puis on recommence) :
   ça garantit un étalement sur toutes les familles même quand on en tire 8 sur 7
   familles, là où un tirage aléatoire à plat sort régulièrement 4 catégories
   « nourriture ». L'ordre final est remélangé pour que la 1re famille ne soit pas
   toujours en tête. */
function shuffled(list){
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
  }
  return out;
}
function randomCategories(count){
  const families = shuffled(CATEGORY_BANK).map(function(fam){ return shuffled(fam); });
  let total = 0;
  families.forEach(function(fam){ total += fam.length; });
  const want = Math.min(count || CATEGORIES_PER_GAME, total);
  const picked = [];
  let pass = 0;
  while (picked.length < want){
    let added = 0;
    for (let i = 0; i < families.length && picked.length < want; i++){
      if (families[i].length > pass){ picked.push(families[i][pass]); added++; }
    }
    if (!added) break;   /* filet de sécurité : ne peut pas arriver avec want <= total */
    pass++;
  }
  return shuffled(picked);
}

/* Une réponse n'est exclue qu'à la majorité des AUTRES joueurs : son auteur ne
   vote pas pour lui-même, donc sur une partie à 4 il faut 2 refus sur les 3
   votants possibles. Avant, un seul refus suffisait — tenable entre gens de
   bonne foi, mais un seul joueur pouvait invalider tout le monde.
   Le dénominateur, ce sont les votants possibles et pas ceux qui ont voté :
   sinon, à 10 joueurs, deux personnes pressées suffiraient à exclure un mot. */
function refusalsNeeded(playerCount){
  const voters = Math.max(0, playerCount - 1);
  return Math.floor(voters / 2) + 1;   /* strictement plus de la moitié */
}
function isRefused(round, catIdx, key, playerCount){
  return voteTally(round, catIdx, key).no >= refusalsNeeded(playerCount);

function voteTally(round, catIdx, key){
  const votes = (((round.votes||{})[catIdx]||{})[key]) || {};
  let yes = 0, no = 0;
  Object.keys(votes).forEach(function(v){ if (votes[v] === true) yes++; else if (votes[v] === false) no++; });
  return { yes: yes, no: no };

/* Article en tête de réponse : « Une Ferrari » et « Ferrari », c'est le même mot,
   et c'est le F qui compte pour la lettre du tour. On retire donc l'article avant
   de comparer deux réponses et avant de vérifier l'initiale — jamais pour
   l'affichage, qui garde ce que le joueur a tapé.
   Un seul article est retiré (pas de boucle), et on ne vide jamais la réponse :
   « L' ½ tout seul reste « l' ½ plutôt que de devenir une chaîne vide, sinon il
   passerait de « réponse écrite » à « pas de réponse ». */
const LEADING_ARTICLES = ['de la ','de l\'','des ','du ','de ','d\'','les ','le ','la ','l\'','une ','un ','aux ','au ']
  .sort(function(a, b){ return b.length - a.length; });   /* le plus long d'abord : « de la » avant « de » */
function coreWord(raw){
  const n = normalize(raw);
  for (let i = 0; i < LEADING_ARTICLES.length; i++){
    const a = LEADING_ARTICLES[i];
    if (n.indexOf(a) === 0){

      if (rest) return rest;

function levenshtein(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  let prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++){
    cur[0] = i;
    for (j = 1; j <= n; j++){
      const cost = a.charAt(i-1) === b.charAt(j-1) ? 0 : 1;
      cur[j] = Math.min(cur[j-1] + 1, prev[j] + 1, prev[j-1] + cost);
    }
    prev = cur; cur = [];
  }
  return prev[n];
}
/* "Hongrie" et "Hongrir", c'est le même pays mal tapé : ça doit compter comme un
   doublon (1 pt chacun) et non comme deux réponses uniques. La tolérance grandit
   avec la longueur du mot — sur un mot court, une lettre d'écart change le sens. */
/* Abréviations : « foot » et « football », c'est le même sport, mais l'écart de
   longueur dépasse de loin la tolérance aux fautes de frappe. On accepte donc
   qu'un mot soit le début de l'autre, sous trois conditions qui évitent les
   fusions absurdes :
   - même nombre de mots, sinon « football » avalerait « football américain » ;
   - au moins 4 lettres dans le plus court, pour écarter « car »/« carotte » ;
   - au moins 3 lettres d'écart, pour écarter « ours »/« oursin » et « chat »/« chaton ».
   Il reste des faux positifs théoriques (« train »/« traineau », « porc »/« porcelet »),
   mais la comparaison ne se fait qu'à l'intérieur d'une même catégorie, ce qui

function wordCount(str){

function isAbbrevOf(short, long){
  if (short.length < 4) return false;
  if (long.length - short.length < 3) return false;   /* négatif si short est le plus long */
  if (long.indexOf(short) !== 0) return false;
  return wordCount(short) === wordCount(long);
}
function sameWord(a, b){

  if (isAbbrevOf(a, b) || isAbbrevOf(b, a)) return true;
  if (Math.abs(a.length - b.length) > 2) return false;
  /* Seuil calé sur le mot le plus court : sur 3 ou 4 lettres, une lettre d'écart
     change souvent le mot (riz / ris), alors que sur un mot long c'est une faute. */
  const minLen = Math.min(a.length, b.length);
  const tol = minLen >= 7 ? 2 : (minLen >= 4 ? 1 : 0);
  return tol > 0 && levenshtein(a, b) <= tol;

function scoreRound(round, keys, categories){
  const perCat = {}; const totals = {};
  const answers = round.answers || {};
  keys.forEach(function(k){ perCat[k] = {}; totals[k] = 0; });
  categories.forEach(function(cat, idx){
    const norms = {};
    keys.forEach(function(k){
      const raw = (answers[k] && answers[k][idx]) || '';
      const n = coreWord(raw);
      if (!n || tooShort(raw)){ norms[k] = null; return; }
      /* Validée par défaut ; on ne vote que pour refuser, et il faut la majorité. */
      norms[k] = isRefused(round, idx, k, keys.length) ? null : n;
    });
    /* Regroupement des réponses identiques, fautes de frappe comprises. */
    const groups = [];
    keys.forEach(function(k){
      if (!norms[k]) return;
      for (let i = 0; i < groups.length; i++){
        if (sameWord(groups[i].word, norms[k])){ groups[i].members.push(k); return; }
      }
      groups.push({ word: norms[k], members: [k] });
    });
    const groupSize = {};
    groups.forEach(function(g){
      g.members.forEach(function(k){ groupSize[k] = g.members.length; });
    });
    keys.forEach(function(k){
      const pts = norms[k] ? (groupSize[k] === 1 ? 2 : 1) : 0;
      perCat[k][idx] = pts;
      totals[k] += pts;
    });
  });

  if (s.currentRound && Date.now() >= roundEndsAt(s.currentRound)) rounds.push(s.currentRound);
  rounds.forEach(function(r){
    const res = scoreRound(r, keys, s.categories);
    keys.forEach(function(k){ totals[k] += (res.totals[k]||0); });
  });
  return totals;
}

    user: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>'
  };

/* Marque de la barre du haut. Pas un icon() : les icônes d'interface sont en trait fin
   monochrome, la marque est une forme pleine cernée d'encre comme les tuiles et les

function renderLogoTiles(){
  const rows = [['P','E','T','I','T'], ['B','A','C']];
  const rotations = [-2,1,-1,2,-1,1,-2];
  let idx = 0;
  return rows.map(function(row){
    const tiles = row.map(function(ch){
      const rot = rotations[idx % rotations.length];
      idx++;
      return '<span class="tile" style="transform:rotate('+rot+'deg)">'+ch+'<b class="tile-pts">'+scrabbleValue(ch)+'</b></span>';
    }).join('');
    return '<div class="tile-row">' + tiles + '</div>';
  }).join('');
}

/* ---------- profil (par appareil, jamais synchronisé) ---------- */
function readProfile(){
  try {
    const p = JSON.parse(localStorage.getItem('pb_profile') || 'null');
    if (p && p.name){
      return { name: p.name, emoji: p.emoji || AVATAR_EMOJIS[0], color: p.color || AVATAR_COLORS[0] };
    }
  } catch(e){}
  /* Ancien format : prénom et avatar stockés séparément par les écrans de création
     et de participation. On le relit pour que les joueurs déjà passés par là aient
     un profil tout prêt au lieu de repartir de zéro. */
  const name = localStorage.getItem('pb_lastName') || '';
  if (!name) return null;
  let emoji = AVATAR_EMOJIS[0], color = AVATAR_COLORS[0];
  try {
    const saved = JSON.parse(localStorage.getItem('pb_avatar') || 'null');
    if (saved){ emoji = saved.emoji || emoji; color = saved.color || color; }
  } catch(e){}
  return { name: name, emoji: emoji, color: color };
}
function writeProfile(p){
  try {
    localStorage.setItem('pb_profile', JSON.stringify(p));
    /* On continue d'alimenter les anciennes clés : elles servent encore de valeurs
       par défaut aux écrans de création et de participation. */
    localStorage.setItem('pb_lastName', p.name);
    localStorage.setItem('pb_avatar', JSON.stringify({ emoji: p.emoji, color: p.color }));
  } catch(e){}
}
/* ---------- stats locales (par appareil, jamais synchronisées) ---------- */
function readStats(){
  try {
    const st = JSON.parse(localStorage.getItem('pb_stats') || 'null');
    if (st && typeof st === 'object'){
      return { rounds: st.rounds || 0, best: st.best || 0, letter: st.letter || '', mark: st.mark || '' };
    }
  } catch(e){}
  return { rounds: 0, best: 0, letter: '', mark: '' };
}
function writeStats(st){
  try { localStorage.setItem('pb_stats', JSON.stringify(st)); } catch(e){}
}
function countRoundPlayed(s){
  if (!s.currentRound || !myKey || !s.players[myKey]) return;
  const mark = currentPin + '_' + s.currentRound.number;
  const st = readStats();
  if (st.mark === mark) return;   /* une manche n'est comptée qu'une fois */
  st.mark = mark;
  st.rounds += 1;
  st.letter = s.currentRound.letter || st.letter;
  writeStats(st);
}
function updateBestScore(s){
  if (!s.currentRound || !myKey || !s.players[myKey]) return;
  const res = scoreRound(s.currentRound, Object.keys(s.players), s.categories);
  const mine = res.totals[myKey] || 0;
  const st = readStats();
  if (mine > st.best){ st.best = mine; writeStats(st); }
}

function showJoinError(msg){

function attemptCreatePin(tries, name){
  if (tries > 8){ setBusy(false,''); showToast('Impossible de créer une partie, réessaie.'); return; }
  const pin = generatePin();
  db.ref('games/' + pin).transaction(function(current){
    if (current === null){
      const key = keyFor(name);
      const players = {};
      players[key] = { name: name, emoji: draftEmoji, color: draftColor, seen: Date.now() };
      return {
        hostName: name,
        hostKey: key,
        createdAt: Date.now(),
        lastActivity: Date.now(),
        categories: randomCategories(CATEGORIES_PER_GAME),
        roundDurationMs: DEFAULT_ROUND_MS,
        maxRounds: DEFAULT_MAX_ROUNDS,
        players: players,
        currentRound: null,
        history: {}
      };
    }
    return;
  }, function(err, committed){
    if (err){ setBusy(false,''); showToast('Erreur, réessaie.'); return; }
    if (!committed){ attemptCreatePin(tries+1, name); return; }
    setBusy(false,'');
    writeProfile({ name: name, emoji: draftEmoji, color: draftColor });
    enterRoom(pin, name, keyFor(name));
  });

function handleConfirmJoin(){
  const name = draftNameValue();
  const pin = draftPin;
  if (!name){ showJoinError('Choisis un prénom.'); return; }
  if (!/^\d{4}$/.test(pin)){ showJoinError('Code à 4 chiffres.'); return; }
  showJoinError('');
  setBusy(true, 'Connexion…');
  /* Quand on entre directement depuis le profil, l'écran de saisie n'est pas affiché :
     en cas de refus, on l'ouvre pour que le joueur puisse corriger son prénom. */
  const fallbackToForm = function(msg){
    if (document.getElementById('join-error')){ showJoinError(msg); return; }
    uiScreen = 'join';
    renderTop();
    showJoinError(msg);
  };
  const ref = db.ref('games/' + pin);
  ref.once('value').then(function(snap){
    if (!snap.exists()){
      setBusy(false,'');
      fallbackToForm('Cette partie n’existe plus.');
      return;
    }
    const key = keyFor(name);
    ref.child('players').child(key).transaction(function(current){
      if (current === null) return { name: name, emoji: draftEmoji, color: draftColor, seen: Date.now() };
      if (current.name && normalize(current.name) === normalize(name)) return { name: name, emoji: draftEmoji, color: draftColor, seen: Date.now() };
      return;
    }, function(txErr, committed){
      setBusy(false,'');
      if (txErr){ showToast('Erreur.'); return; }
      if (!committed){ fallbackToForm('Ce prénom est déjà pris dans cette partie.'); return; }
      writeProfile({ name: name, emoji: draftEmoji, color: draftColor });
      ref.child('lastActivity').set(Date.now());
      enterRoom(pin, name, key);
    });
  }).catch(function(){ setBusy(false,''); showToast('Erreur de connexion.'); });
}

/* ---------- room lifecycle ---------- */
function enterRoom(pin, name, key){
  currentPin = pin;
  myName = name; myKey = key;
  localStorage.setItem('pb_identity_' + pin, JSON.stringify({name:name, key:key}));
  history.replaceState(null, '', '?pin=' + pin);
  detachHomeListener();
  hasRenderedOnce = false;
  lastPhase = null;
  lastRoundNumber = null;
  hasAutoSubmitted = false;
  locked = false;
  localAnswers = {};
  uiScreen = 'room';
  lastHeartbeatAt = 0;
  lastHostCheckAt = 0;
  wasHost = false;
  attachRoomListener(pin);
}
function attachRoomListener(pin){
  if (roomRef) roomRef.off();
  roomRef = db.ref('games/' + pin);
  roomRef.on('value', roomSnapshotHandler, function(){
    showToast('Connexion à la partie impossible.');
  });
}
function detachRoomListener(){
  if (roomRef){ roomRef.off(); roomRef = null; }
}
function goHome(){
  detachRoomListener();
  currentPin = null; myKey = ''; myName = '';
  history.replaceState(null, '', location.pathname);
  uiScreen = 'home';
  attachHomeListener();
  renderTop();
}
function roomSnapshotHandler(snap){
  const val = snap.val();
  if (val === null){
    if (uiScreen === 'room'){ showToast('Cette partie a été fermée.'); goHome(); }
    return;
  }
  const lastAct = val.lastActivity || val.createdAt || 0;
  if (Date.now() - lastAct > INACTIVITY_MS){
    if (roomRef) roomRef.remove();
    return;
  }
  state = {
    hostName: val.hostName || '',
    hostKey: val.hostKey || '',
    maxRounds: (val.maxRounds !== undefined && val.maxRounds !== null) ? val.maxRounds : 0,
    categories: val.categories || DEFAULT_CATEGORIES,
    roundDurationMs: val.roundDurationMs || DEFAULT_ROUND_MS,
    players: val.players || {},
    currentRound: val.currentRound || null,
    history: val.history || {},
    recentLetters: val.recentLetters || []
  };
  const roundChanged = syncRoundLocalState();
  const nowHost = !!myKey && myKey === state.hostKey;
  if (nowHost && !wasHost && hasRenderedOnce) showToast('L’hôte est parti, c’est toi qui prends la main.');
  wasHost = nowHost;
  sendHeartbeat(!hasRenderedOnce);   /* présence écrite dès l'arrivée */
  const phase = getPhase(state);
  /* On ne re-rend pas pendant qu'on joue, pour ne pas effacer la saisie en cours —
     mais uniquement tant qu'on reste sur la même manche : si la manche a changé,
     l'affichage doit repartir de zéro même si on est déjà en phase de jeu. */
  if (!hasRenderedOnce || roundChanged || phase !== 'playing'){ renderTop(); }
  if (phase === 'reveal') submitMyAnswers();
  hasRenderedOnce = true;
}
/* Réponses saisies, verrou "j'ai fini" et drapeau d'envoi sont propres à UNE manche.
   Ils n'étaient remis à zéro qu'à l'entrée dans la partie : à la manche suivante on
   retrouvait donc ses réponses précédentes, grisées pour qui avait fini le premier,
   et surtout submitMyAnswers() ressortait aussitôt — plus aucune réponse n'était
   envoyée dès la 2e manche. On les resynchronise à chaque changement de manche. */
function syncRoundLocalState(){
  const roundNo = state.currentRound ? state.currentRound.number : null;
  if (roundNo === lastRoundNumber) return false;
  lastRoundNumber = roundNo;
  localAnswers = {};
  locked = false;
  hasAutoSubmitted = false;
  if (roundNo === null) return true;
  /* Rechargement en cours de manche (onglet rouvert) : on récupère le brouillon. */
  cleanupOldRoundStorage(currentPin, roundNo);
  const draft = sessionStorage.getItem(draftKey(currentPin, roundNo));
  if (draft){ try { localAnswers = JSON.parse(draft); } catch(e){} }
  locked = sessionStorage.getItem(lockedKey(currentPin, roundNo)) === '1';
  attemptPendingSubmit();
  return true;
}

/* Partage natif quand le navigateur le propose (iOS, Android), presse-papier
   sinon. Les deux peuvent échouer ou être annulés par l'utilisateur : on ne
   traite ça comme une erreur dans aucun des deux cas. */
function handleShareLink(){
  if (!currentPin) return;

  if (navigator.share){
    navigator.share({ title: 'Petit Bac', text: 'Rejoins ma partie de Petit Bac', url: url }).catch(function(){});

/* Plus de bouton « Paramètres » ici : les deux pastilles de règles du salon

function renderLobbyBottom(s){

function renderRevealContent(s){
  const round = s.currentRound;
  const keys = Object.keys(s.players);
  const res = scoreRound(round, keys, s.categories);
  const answers = round.answers || {};
  const answeredCount = keys.filter(function(k){ return !!answers[k]; }).length;
  const idx = Math.min(reviewIndexOf(s), s.categories.length - 1);
  const cat = s.categories[idx];
  let html = '<div class="hero"><div class="letter-badge small">'+esc(round.letter)+'<b class="tile-pts">'+scrabbleValue(round.letter)+'</b></div>' +
    '<p class="section-title">Validation · manche '+round.number+'</p></div>';
  if (answeredCount < keys.length) html += '<p class="muted" style="text-align:center;font-size:.82rem;">'+answeredCount+'/'+keys.length+' ont répondu</p>';
  html += renderCategoryDots(s.categories.length, idx);
  html += '<p class="review-progress">Catégorie '+(idx+1)+'/'+s.categories.length+'</p>';
  html += '<div class="reveal-card"><h3>'+esc(cat)+'</h3>';
  html += keys.map(function(k){
    const raw = (answers[k] && answers[k][idx]) || '';
    const pts = res.perCat[k][idx];
    const who = esc(s.players[k].name) + (k === myKey ? ' (toi)' : '');
    if (!raw){
      return '<div class="review-block"><div class="review-top">' + playerAvatarHtml(s.players[k],'small') +
        '<span class="review-who">'+who+'</span><span class="review-pts-badge">0</span></div>' +
        '<p class="review-word empty">pas de réponse</p></div>';
    }
    const badgeCls = pts === 2 ? ' pts-2' : (pts === 1 ? ' pts-1' : '');
    const badge = '<span class="review-pts-badge'+badgeCls+'">'+(pts?('+'+pts):'0')+'</span>';
    /* Une lettre seule : refusée d'office, il n'y a rien à voter. */
    if (tooShort(raw)){
      return '<div class="review-block"><div class="review-top">' + playerAvatarHtml(s.players[k],'small') +
        '<span class="review-who">'+who+'</span>' + badge + '</div>' +
        '<p class="review-word">'+esc(raw)+' <span class="review-note">une seule lettre</span></p></div>';
    }
    const tally = voteTally(round, idx, k);
    const needed = refusalsNeeded(keys.length);
    const votesForThis = (((round.votes||{})[idx]||{})[k]) || {};
    const iRefused = votesForThis[myKey] === false;
    const refused = isRefused(round, idx, k, keys.length);
    const mine = k === myKey;
    const n = coreWord(raw);
    const letterWarn = !(n.length > 0 && n[0] === round.letter.toLowerCase());
    return '<div class="review-block"><div class="review-top">' + playerAvatarHtml(s.players[k],'small') +
      '<span class="review-who">'+who+'</span>' +
      (tally.no ? '<span class="review-tally">'+icon('x')+tally.no+'/'+needed+'</span>' : '') +
      badge + '</div>' +
      '<p class="review-word'+(refused?' refused':'')+'">'+esc(raw)+(letterWarn?(' <span class="letter-warn" title="Ne commence pas par la lettre du tour">'+icon('warning')+'</span>'):'')+'</p>' +
      /* On ne vote pas contre son propre mot : le bouton disparaît, le compteur reste. */
      (mine ? '' :
        '<div class="vote-row">' +
          '<button type="button" class="vote-btn'+(iRefused?' active-no':'')+'" data-action="vote" data-cat="'+idx+'" data-target="'+k+'" data-value="no">' +
            icon('x') + (iRefused ? 'Tu l’as refusée' : 'Refuser') + '</button>' +
        '</div>') +
      '</div>';
  }).join('');
  html += '</div>';
  if (idx > 0 && myKey === s.hostKey) html += '<div style="text-align:center;"><button type="button" class="btn-link" data-action="review-prev">'+icon('chevronLeft')+'Catégorie précédente</button></div>';
  const needed = refusalsNeeded(keys.length);
  const needText = needed > 1
    ? 'Il faut ' + needed + ' refus pour retirer une réponse'
    : 'Un refus suffit à retirer une réponse';
  html += '<p class="legend">Tout compte par défaut : 2 pts si personne n’a le même mot, 1 pt sinon. ' +
    needText + ', et on ne vote pas contre son propre mot.</p>';
  return html;
}

function podiumDelayFor(pos){
  if (pos === 0) return PODIUM_DELAYS.first;
  if (pos === 1) return PODIUM_DELAYS.second;
  return PODIUM_DELAYS.third;
}
function renderPodium(s, sorted, totals, animate){
  const order = [1,0,2];
  let html = '<div class="podium">';
  order.forEach(function(pos){
    const k = sorted[pos];
    if (!k){ html += '<div class="podium-step empty p'+pos+'"></div>'; return; }
    const stepCls = 'podium-step p' + pos + (animate ? ' pod-step-in' : '');
    const stepStyle = animate ? ' style="--d:' + podiumDelayFor(pos) + 's"' : '';
    let spot = '';
    if (pos === 0){
      const spotCls = 'podium-spotlight' + (animate ? ' lights-on' : '');
      const spotStyle = animate ? ' style="--d:' + (PODIUM_DELAYS.first + 0.12) + 's"' : '';
      spot = '<span class="' + spotCls + '"' + spotStyle + '></span>';
    }
    html += '<div class="'+stepCls+'"'+stepStyle+'>' + spot +
      playerAvatarHtml(s.players[k],'big') +
      '<span class="podium-name">'+esc(s.players[k].name)+'</span>' +
      '<span class="podium-score">'+(totals[k]||0)+'</span>' +
      '<div class="podium-block rank-'+(pos+1)+'">'+(pos+1)+'</div></div>';
  });
  html += '</div>';
  return html;
}
function renderLeaderboardContent(s){
  const round = s.currentRound;
  const keys = Object.keys(s.players);
  const isFinal = s.maxRounds > 0 && round.number >= s.maxRounds;
  const roundRes = scoreRound(round, keys, s.categories);
  const roundMax = keys.reduce(function(m,k){ return Math.max(m, roundRes.totals[k]||0); }, 0);
  const roundWinners = keys.filter(function(k){ return roundMax > 0 && (roundRes.totals[k]||0) === roundMax; });
  const totals = cumulativeTotals(s);
  const sorted = keys.slice().sort(function(a,b){ return (totals[b]||0)-(totals[a]||0); });
  const animate = !podiumSettled;
  /* La bannière nomme le vainqueur : elle arrive avec la 1re place, jamais avant. */
  const bannerCls = 'mvp-banner' + (animate ? ' pod-fade-in' : '');
  const bannerStyle = animate ? ' style="--d:' + PODIUM_DELAYS.first + 's"' : '';
  let html = '<div class="hero"><p class="section-title">'+(isFinal ? 'Partie terminée !' : 'Classement')+'</p></div>';
  if (isFinal){
    const gameMax = totals[sorted[0]] || 0;
    const gameWinners = sorted.filter(function(k){ return gameMax > 0 && (totals[k]||0) === gameMax; });
    if (gameWinners.length){
      html += '<p class="'+bannerCls+'"'+bannerStyle+'>'+icon('trophy')+gameWinners.map(function(k){ return esc(s.players[k].name); }).join(' & ')+' remporte'+(gameWinners.length>1?'nt':'')+' la partie !</p>';
    }
  } else if (roundWinners.length && roundWinners.length < keys.length){
    html += '<p class="'+bannerCls+'"'+bannerStyle+'>'+icon('trophy')+roundWinners.map(function(k){ return esc(s.players[k].name); }).join(' & ')+' rafle'+(roundWinners.length>1?'nt':'')+' la manche '+round.number+'</p>';
  }
  html += renderPodium(s, sorted, totals, animate);
  if (sorted.length > 3){
    const listCls = 'leaderboard-list' + (animate ? ' pod-fade-in' : '');
    const listStyle = animate ? ' style="--d:' + PODIUM_DELAYS.rest + 's"' : '';
    html += '<div class="'+listCls+'"'+listStyle+'>' + sorted.slice(3).map(function(k, i){
      return '<div class="leaderboard-row"><span class="lb-rank">'+(i+4)+'</span>' + playerAvatarHtml(s.players[k],'small') +
        '<span class="lb-name">'+esc(s.players[k].name)+'</span><span class="lb-score">'+(totals[k]||0)+'</span></div>';
    }).join('') + '</div>';
  }
  return html;
}
function renderLeaderboardBottom(s){
  const round = s.currentRound;
  const isFinal = s.maxRounds > 0 && round.number >= s.maxRounds;
  if (isFinal){
    return '<button type="button" class="cta" data-action="replay-game">'+icon('play')+' Rejouer</button>';
  }

/* ---------- scoreboard ---------- */
function renderScoreboard(s){
  const keys = Object.keys(s.players);
  if (!keys.length) return '';
  const totals = cumulativeTotals(s);
  const sorted = keys.slice().sort(function(a,b){ return (totals[b]||0)-(totals[a]||0); });
  const max = sorted.length ? (totals[sorted[0]]||0) : 0;
  return sorted.map(function(k){
    const lead = (totals[k]===max && max>0) ? ' lead' : '';
    const p = s.players[k];
    return '<div class="player-pill'+lead+'">' + playerAvatarHtml(p) + '<span class="name">'+esc(p.name)+(k===myKey?' (toi)':'')+'</span><span class="score">'+(totals[k]||0)+'</span></div>';
  }).join('');
}

/* ---------- ticking UI ---------- */
function updateTimerUI(){
  const round = state.currentRound;
  if (!round) return;
  const now = Date.now();
  let totalSec, remain;
  if (round.finishedAt){
    totalSec = FINISH_GRACE_MS/1000;
    remain = Math.max(0, Math.ceil((round.finishedAt + FINISH_GRACE_MS - now)/1000));
  } else {
    totalSec = Math.max(1, Math.round((state.roundDurationMs||DEFAULT_ROUND_MS)/1000));
    remain = Math.max(0, Math.ceil((round.endTime - now)/1000));
  }
  const label = document.getElementById('timer-display');
  if (label) label.textContent = formatTime(remain);
  const ring = document.getElementById('ring-fg');
  if (ring){
    const frac = Math.max(0, Math.min(1, remain/totalSec));
    ring.style.strokeDashoffset = (RING_CIRC * (1-frac)).toFixed(1);
    ring.classList.toggle('danger', remain <= 10 || !!round.finishedAt);
  }
}
function updateCountdownUI(){
  if (!state.currentRound) return;
  const secs = Math.max(0, Math.ceil((state.currentRound.revealAt - Date.now())/1000));
  const el = document.getElementById('countdown-number');
  if (!el) return;
  const label = secs > 0 ? String(secs) : 'GO !';
  if (label !== lastCountdownLabel){
    lastCountdownLabel = label;
    el.textContent = label;
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }
}

    { n:'trajectoire', c:8,   rx:'5%',  w:62, h:46,  r:-6 },
    { n:'etoile-b',    c:26,  x:'35%',  w:26, h:31,  r:-12 },
    { n:'coeur',       b:98,  x:'4%',   w:26, h:29,  r:-8 },
    { n:'eclair',      b:74,  rx:'7%',  w:40, h:80,  r:6 },
    { n:'etoile-c',    b:36,  rx:'30%', w:24, h:30,  r:10 },
    { n:'avion',       b:28,  x:'7%',   w:64, h:57,  r:-4 }
  ],
  salon: [],
  /* Deux zones seulement, mais bien remplies : les flancs de la lettre (y 120-220,
     la carte de réponses commence à 220, d'où des dessins qui tiennent au-dessus)
     et la bande pleine largeur sous la carte, libre de 660 à 760 sur un écran de
     844 et jusqu'à 880 sur un plus grand — ancrée en bas, elle marche sur les deux. */
  manche: [

function renderDoodles(bg){
  const list = PAPER_DOODLES[bg] || [];
  return list.map(function(d){
    let css = '';
    /* Les ancres passent par les encoches. Le bandeau descend de var(--safe-top)
       et la barre du bas remonte de var(--safe-bottom), donc toute l'UI glisse
       sur un téléphone encoché — alors que le calque, lui, couvre le shell entier.
       Sans ces calc(), un dessin calé « à 140px du haut » se retrouvait 60px trop
       haut par rapport au contenu, et ça ne se voyait sur aucun navigateur de
       bureau où les insets valent 0. Le centre bouge de la moitié de l'écart
       entre les deux insets, pour la même raison. */
    if (d.b !== undefined) css += 'bottom:calc(var(--safe-bottom) + ' + d.b + 'px);';
    else if (d.c !== undefined) css += 'top:calc(50% + (var(--safe-top) - var(--safe-bottom)) / 2 + ' + d.c + 'px);';
    else css += 'top:calc(var(--safe-top) + ' + d.t + 'px);';
    css += (d.x !== undefined ? 'left:' + d.x + ';' : 'right:' + d.rx + ';');
    css += 'width:' + d.w + 'px;height:' + d.h + 'px;';
    if (d.r) css += 'transform:rotate(' + d.r + 'deg);';
    const url = 'url(/bg/d/' + d.n + '.png)';
    css += '-webkit-mask-image:' + url + ';mask-image:' + url + ';';
    return '<span class="doodle" style="' + css + '"></span>';
  }).join('');
}
/* Les masques sont des fichiers à part : sans préchargement ils arrivent un par
   un et les dessins se posent en ordre dispersé après le splash. On les décode
   donc pendant l'écran de lancement, qui attend d'être complet pour se retirer.
   Le plafond évite qu'un fichier muet retienne l'app — le filet final reste
   SPLASH_MAX_MS. */
function preloadDoodles(bg, cb){
  const list = PAPER_DOODLES[bg] || [];
  let reste = list.length;
  let fini = false;
  const termine = function(){
    if (fini) return;
    fini = true;
    cb();
  };
  if (!reste){ termine(); return; }
  const un = function(){
    reste--;
    if (reste <= 0) termine();
  };
  setTimeout(termine, DOODLE_WAIT_MS);
  list.forEach(function(d){
    const img = new Image();
    img.onload = un;
    img.onerror = un;
    img.src = '/bg/d/' + d.n + '.png';
  });
}
/* Les autres écrans sont préchargés une fois l'app affichée : ~65 Ko (83 Ko de
   masques en tout, dont 20 déjà pris par l'accueil), et le changement de fond en
   cours de partie devient instantané. */
function preloadOtherDoodles(){
  Object.keys(PAPER_DOODLES).forEach(function(bg){
    if (bg === 'accueil') return;
    (PAPER_DOODLES[bg] || []).forEach(function(d){
      const img = new Image();
      img.src = '/bg/d/' + d.n + '.png';
    });
  });
}
function markDoodlesReady(){
  if (doodlesReady) return;
  doodlesReady = true;
  const calque = document.getElementById('paper-doodles');
  if (calque) calque.classList.add('ready');
