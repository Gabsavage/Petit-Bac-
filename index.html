<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petit Bac</title>
<meta name="theme-color" content="#150C29">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7FF;--surface:#FFFFFF;--surface-2:#F1EBFB;--border:#E6DEF7;
  --text:#1B1033;--text-soft:#6B5D8C;
  --accent:#FF6B5B;--accent-ink:#FFFFFF;
  --accent-2:#FFC94D;--accent-2-ink:#3A2600;
  --success:#17A673;--dup:#B9821E;--invalid:#9C90B8;--danger:#E63950;
  --success-tint:rgba(23,166,115,.14);--dup-tint:rgba(185,130,30,.16);
  --shell-shadow:0 24px 60px rgba(27,16,51,.18);
  --font-display:'Baloo 2','Arial Rounded MT Bold','Helvetica Rounded',sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150C29;--surface:#221338;--surface-2:#2C1B47;--border:#3A2657;
    --text:#F5F1FA;--text-soft:#A99BC7;
    --accent:#FF7A63;--accent-ink:#1B0F0C;
    --accent-2:#FFD166;--accent-2-ink:#3A2600;
    --success:#4CE0A0;--dup:#FFD166;--invalid:#7C6E9C;--danger:#FF5C72;
    --success-tint:rgba(76,224,160,.16);--dup-tint:rgba(255,209,102,.16);
    --shell-shadow:0 24px 70px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#150C29;--surface:#221338;--surface-2:#2C1B47;--border:#3A2657;
  --text:#F5F1FA;--text-soft:#A99BC7;
  --accent:#FF7A63;--accent-ink:#1B0F0C;
  --accent-2:#FFD166;--accent-2-ink:#3A2600;
  --success:#4CE0A0;--dup:#FFD166;--invalid:#7C6E9C;--danger:#FF5C72;
  --success-tint:rgba(76,224,160,.16);--dup-tint:rgba(255,209,102,.16);
  --shell-shadow:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
#app-shell{position:relative;height:100dvh;height:100vh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
#app-shell::before,#app-shell::after{content:'';position:absolute;border-radius:50%;filter:blur(70px);opacity:.3;z-index:0;pointer-events:none;}
#app-shell::before{width:280px;height:280px;background:var(--accent);top:-100px;right:-80px;}
#app-shell::after{width:240px;height:240px;background:var(--accent-2);bottom:-70px;left:-70px;}
@media (min-width:560px){
  #app-shell{margin:22px auto;height:calc(100dvh - 44px);border-radius:30px;box-shadow:var(--shell-shadow);border:1px solid var(--border);}
}
.app-bar{position:relative;z-index:1;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 16px) 18px 8px;}
.app-bar-title{font-family:var(--font-display);font-weight:700;font-size:1.28rem;display:flex;align-items:center;}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:8px;}
.conn-dot.hidden{display:none;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text);
  font-size:1.15rem;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.icon-btn:active{transform:scale(.9);}
.icon-btn[hidden]{display:none;}
.scoreboard-strip{position:relative;z-index:1;flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:6px 18px 14px;-webkit-overflow-scrolling:touch;}
.scoreboard-strip:empty{display:none;}
.player-pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:100px;padding:4px 12px 4px 4px;}
.player-pill.lead{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2) inset;}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;flex-shrink:0;position:relative;}
.avatar.small{width:18px;height:18px;font-size:.6rem;}
.avatar.big{width:56px;height:56px;font-size:1.5rem;position:relative;border:3px solid transparent;}
.player-pill .name{font-size:.8rem;font-weight:600;}
.player-pill .score{font-family:var(--font-mono);font-size:.72rem;color:var(--text-soft);}
.content{position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch;}
.bottom-bar{position:relative;z-index:1;flex:0 0 auto;padding:12px 18px calc(var(--safe-bottom) + 16px);}
.bottom-bar:empty{display:none;}
.cta{width:100%;border:none;border-radius:16px;padding:16px;font-family:var(--font-body);font-weight:700;
  font-size:1.02rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 8px 20px rgba(255,107,91,.3);}
.cta:active{transform:scale(.98);}
.cta:disabled{opacity:.45;box-shadow:none;}
.cta.secondary{background:var(--surface-2);color:var(--text);box-shadow:none;border:1px solid var(--border);}
.cta.secondary.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
.btn-link{background:none;border:none;color:var(--text-soft);text-decoration:underline;padding:6px;font-size:.85rem;cursor:pointer;}
.section-heading{font-size:.82rem;color:var(--text-soft);margin:18px 0 8px;font-weight:600;}
.muted{color:var(--text-soft);}
.error{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:6px 0 0;}
.field{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
  font-size:1.05rem;color:var(--text);font-family:var(--font-body);margin-bottom:10px;}
.field:focus{outline:2px solid var(--accent);outline-offset:1px;}
textarea.field{resize:vertical;font-size:.95rem;}
.pin-field{text-align:center;letter-spacing:6px;font-family:var(--font-mono);font-size:1.3rem;}
.players-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:100px;padding:6px 12px;font-size:.85rem;}
.cover-hero{padding:22px 2px 6px;text-align:center;}
.tile-row{display:flex;justify-content:center;gap:6px;margin-bottom:8px;}
.tile{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
  font-family:var(--font-display);font-weight:700;font-size:1.3rem;box-shadow:0 6px 14px rgba(0,0,0,.2);}
.tile-a{background:var(--accent);color:var(--accent-ink);}
.tile-b{background:var(--accent-2);color:var(--accent-2-ink);}
.tagline{font-family:var(--font-display);font-size:1.2rem;margin:16px 0 4px;font-weight:700;}
.rules-hint{color:var(--text-soft);font-size:.9rem;line-height:1.5;margin:0 auto 6px;max-width:38ch;}
.home-actions{display:flex;flex-direction:column;gap:10px;margin:20px 0 8px;}
.public-games-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.public-game-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-family:var(--font-body);
  font-size:.92rem;color:var(--text);cursor:pointer;text-align:left;width:100%;}
.public-game-row:active{transform:scale(.98);}
.pg-count{color:var(--text-soft);font-size:.78rem;font-family:var(--font-mono);}
.join-hero{padding:14px 2px 4px;}
.join-hero h2{font-family:var(--font-display);font-size:1.5rem;margin:0 0 14px;text-align:center;}
.avatar-preview{display:flex;justify-content:center;margin:2px 0 14px;}
.avatar-preview .avatar.big{font-size:1.9rem;}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px;}
.emoji-choice{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:var(--surface-2);
  font-size:1.25rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.emoji-choice.selected{border-color:var(--accent);background:var(--surface);}
.color-row{display:flex;gap:8px;justify-content:center;margin-bottom:6px;flex-wrap:wrap;}
.color-choice{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
.color-choice.selected{border-color:var(--text);}
.visibility-toggle{display:flex;gap:8px;margin-top:14px;}
.visibility-toggle .cta{width:auto;flex:1;padding:12px;font-size:.92rem;}
.share-block{text-align:center;padding:6px 0 4px;}
.pin-display{display:flex;justify-content:center;gap:6px;margin:8px 0 14px;}
.pin-display.small{margin:10px 0;}
.pin-digit{width:38px;height:46px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:1.3rem;}
.qr-canvas{display:flex;justify-content:center;margin:6px auto 10px;}
.qr-canvas img,.qr-canvas canvas{border-radius:12px;}
.lobby-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:12px 0 4px;}
.lobby-avatar{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;}
.lobby-avatar[data-action]{cursor:pointer;}
.lobby-avatar.ready .avatar.big{border-color:var(--success);}
.ready-badge{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--success);
  color:#fff;font-size:.62rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);}
.lobby-name{font-size:.78rem;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hero{display:flex;flex-direction:column;align-items:center;padding:16px 0 6px;}
.letter-badge{width:96px;height:96px;border-radius:26px;background:var(--accent-2);color:var(--accent-2-ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;
  font-size:2.9rem;transform:rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.22);
  animation:popIn .35s cubic-bezier(.34,1.56,.64,1);}
.letter-badge.small{width:60px;height:60px;font-size:1.9rem;border-radius:18px;margin-bottom:2px;}
@keyframes popIn{from{transform:scale(.4) rotate(-3deg);opacity:0;}to{transform:scale(1) rotate(-3deg);opacity:1;}}
@media (prefers-reduced-motion: reduce){.letter-badge,.countdown-number.pulse{animation:none;}}
.timer-ring{position:relative;width:112px;height:112px;margin-top:14px;}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:8;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:326.7;
  transition:stroke-dashoffset .25s linear,stroke .2s;}
.ring-fg.danger{stroke:var(--danger);}
.timer-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:1.25rem;font-weight:600;}
.section-title{font-family:var(--font-display);font-size:1.15rem;text-align:center;margin:2px 0 4px;font-weight:700;}
.countdown-hero{padding:44px 0;}
.countdown-number{font-family:var(--font-display);font-size:5rem;font-weight:700;color:var(--accent-2);line-height:1;}
.countdown-number.pulse{animation:popIn .3s cubic-bezier(.34,1.56,.64,1);}
.answer-list{display:flex;flex-direction:column;margin-top:14px;border-radius:16px;overflow:hidden;
  background:var(--surface);border:1px solid var(--border);}
.answer-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);}
.answer-row:last-child{border-bottom:none;}
.answer-row .cat-label{flex:0 0 36%;font-size:.83rem;color:var(--text-soft);font-weight:600;}
.answer-row input{flex:1;border:none;background:transparent;font-size:1.05rem;color:var(--text);
  font-family:var(--font-body);padding:6px 0;min-width:0;}
.answer-row input:focus{outline:none;}
.answer-row input:disabled{color:var(--text-soft);}
.mvp-banner{text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--accent-2);margin:0 0 14px;}
.reveal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;margin-bottom:12px;}
.reveal-card h3{font-family:var(--font-display);font-size:1.02rem;margin:0 0 10px;font-weight:700;}
.answer-chips{display:flex;flex-wrap:wrap;gap:8px;}
.answer-chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:100px;padding:4px 10px 4px 4px;font-size:.84rem;}
.answer-chip .word{font-weight:600;}
.answer-chip.empty .word{color:var(--invalid);font-style:italic;font-weight:400;}
.answer-chip .pts{font-family:var(--font-mono);font-size:.7rem;padding:2px 7px;border-radius:100px;color:var(--invalid);}
.answer-chip.unique .pts{background:var(--success-tint);color:var(--success);}
.answer-chip.dup .pts{background:var(--dup-tint);color:var(--dup);}
.legend{font-size:.78rem;text-align:center;margin:6px 0 10px;}
.status-toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--text);color:var(--bg);
  padding:9px 18px;border-radius:100px;font-size:.82rem;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis;}
.status-toast.show{opacity:1;transform:translate(-50%,0);}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,4,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;}
.sheet-backdrop.open{opacity:1;pointer-events:auto;}
.bottom-sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(100%);background:var(--surface);
  border-radius:22px 22px 0 0;padding:8px 20px calc(var(--safe-bottom) + 22px);
  transition:transform .28s cubic-bezier(.32,.72,0,1);z-index:41;max-height:78%;overflow-y:auto;
  box-shadow:0 -12px 30px rgba(0,0,0,.2);}
.bottom-sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:100px;margin:6px auto 14px;}
.sheet-title{font-family:var(--font-display);font-size:1.15rem;margin:0 0 4px;font-weight:700;}
.duration-choices{display:flex;gap:8px;margin-top:8px;}
.duration-choices .cta.secondary{width:auto;flex:1;padding:10px;font-size:.9rem;}
.mono{font-family:var(--font-mono);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<div id="app-shell">
  <div class="app-bar">
    <button type="button" id="back-btn" class="icon-btn" data-action="go-home" aria-label="Retour" hidden>←</button>
    <span class="app-bar-title">✏️ Petit Bac<span id="conn-dot" class="conn-dot hidden"></span></span>
    <button type="button" id="menu-btn" class="icon-btn" data-action="open-menu" aria-label="Réglages" hidden>⋯</button>

  <div id="bottom-sheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDIFqbXwsi-vC9R5akj_V_n5Jj-5Ts8uEY",
  authDomain: "petit-bac-c24bf.firebaseapp.com",
  databaseURL: "https://petit-bac-c24bf-default-rtdb.firebaseio.com",
  projectId: "petit-bac-c24bf",
  storageBucket: "petit-bac-c24bf.firebasestorage.app",
  messagingSenderId: "541046866471",
  appId: "1:541046866471:web:74ba97097ca9ce5d070402"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const LETTER_POOL = ['A','B','C','D','E','F','G','H','I','J','L','M','N','O','P','R','S','T','V'];
const DEFAULT_CATEGORIES = ["Prénom","Pays / Villes","Métiers","Célébrité","Marque","Animal","Partie du corps","Nourriture"];
const AVATAR_EMOJIS = ['😀','😎','🤠','🥳','🤖','👻','🐶','🐱','🦊','🐻','🐼','🐸','🦁','🐵','🦄','🐙','🦖','🐧','🐰','🦉','🐢','🦋','🐝','🍕'];
const AVATAR_COLORS = ['#FF6B5B','#FFC94D','#4CE0A0','#5B8DEF','#C77DFF','#FF7AA8','#4DD4E8','#F2A65A'];
const RING_CIRC = 2 * Math.PI * 52;
const COUNTDOWN_MS = 3000;

let uiScreen = 'home'; // home | create | join | room
let currentPin = null;
let roomRef = null;
let homeGamesRef = null;
let lastPublicSnapshot = null;
let pinLocked = false;
let draftPin = '';
let draftPublic = true;
let draftName = localStorage.getItem('pb_lastName') || '';
let draftEmoji = AVATAR_EMOJIS[0];
let draftColor = AVATAR_COLORS[0];
(function(){
  try {
    const saved = JSON.parse(localStorage.getItem('pb_avatar') || 'null');
    if (saved){ draftEmoji = saved.emoji || draftEmoji; draftColor = saved.color || draftColor; }
  } catch(e){}
})();

let state = { hostName:'', public:true, categories: DEFAULT_CATEGORIES, roundDurationMs: 90000, players: {}, currentRound: null, history: {}, ready: {} };
let myName = '';
let myKey = '';
let localAnswers = {};
let locked = false;
let hasAutoSubmitted = false;
let lastPhase = null;
let lastCountdownLabel = null;
let hasRenderedOnce = false;

function esc(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function normalize(str){
  return String(str||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function keyFor(name){
  const cleaned = String(name||'').replace(/[.#$\[\]\/\u0000-\u001F\u007F]/g,'').trim();
  return 'p_' + (cleaned || Math.random().toString(36).slice(2,8));
}
function generatePin(){
  return String(Math.floor(Math.random()*10000)).padStart(4,'0');
}
function pickLetter(used){
  let avail = LETTER_POOL.filter(function(l){ return used.indexOf(l) === -1; });
  if (!avail.length) avail = LETTER_POOL.slice();
  return avail[Math.floor(Math.random()*avail.length)];
}
function playerAvatarHtml(player, sizeClass, badgeHtml){
  const bg = (player && player.color) || '#8888aa';
  const emo = (player && player.emoji) || '❓';
  return '<span class="avatar'+(sizeClass?(' '+sizeClass):'')+'" style="background:'+esc(bg)+'">'+esc(emo)+(badgeHtml||'')+'</span>';
}
function scoreRound(round, keys, categories){
  const perCat = {}; const totals = {};
  const answers = round.answers || {};
  keys.forEach(function(k){ perCat[k] = {}; totals[k] = 0; });
  categories.forEach(function(cat){
    const norms = {};
    keys.forEach(function(k){
      const raw = (answers[k] && answers[k][cat]) || '';
      const n = normalize(raw);
      const valid = n.length > 0 && n[0] === round.letter.toLowerCase();
      norms[k] = valid ? n : null;
    });
    const counts = {};
    keys.forEach(function(k){ if (norms[k]) counts[norms[k]] = (counts[norms[k]]||0) + 1; });
    keys.forEach(function(k){
      const pts = norms[k] ? (counts[norms[k]] === 1 ? 10 : 5) : 0;
      perCat[k][cat] = pts;
      totals[k] += pts;
    });
  });
  return { perCat: perCat, totals: totals };
}
function historyList(s){
  return Object.keys(s.history||{}).map(function(k){ return s.history[k]; });
}
function cumulativeTotals(s){
  const keys = Object.keys(s.players);
  const totals = {};
  keys.forEach(function(k){ totals[k] = 0; });
  const rounds = historyList(s);
  if (s.currentRound && Date.now() >= s.currentRound.endTime) rounds.push(s.currentRound);
  rounds.forEach(function(r){
    const res = scoreRound(r, keys, s.categories);
    keys.forEach(function(k){ totals[k] += (res.totals[k]||0); });
  });
  return totals;
}
function getPhase(s){
  if (!s.currentRound) return 'lobby';
  const now = Date.now();
  if (s.currentRound.revealAt && now < s.currentRound.revealAt) return 'countdown';
  if (now < s.currentRound.endTime) return 'playing';
  return 'reveal';
}
function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds/60);
  const sec = totalSeconds % 60;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

      const rot = rotations[idx % rotations.length];
      const cls = (idx % 2 === 0) ? 'tile-a' : 'tile-b';
      idx++;
      return '<span class="tile '+cls+'" style="transform:rotate('+rot+'deg)">'+ch+'</span>';
    }).join('');

  }).join('');

function attemptCreatePin(tries, name){
  if (tries > 8){ setBusy(false,''); showToast('Impossible de créer une partie, réessaie.'); return; }
  const pin = generatePin();
  db.ref('games/' + pin).transaction(function(current){
    if (current === null){
      const key = keyFor(name);
      const players = {};
      players[key] = { name: name, emoji: draftEmoji, color: draftColor };
      return {
        hostName: name,
        public: !!draftPublic,
        createdAt: Date.now(),
        categories: DEFAULT_CATEGORIES,
        roundDurationMs: 90000,
        players: players,
        ready: {},
        currentRound: null,
        history: {}
      };
    }
    return;
  }, function(err, committed){
    if (err){ setBusy(false,''); showToast('Erreur, réessaie.'); return; }
    if (!committed){ attemptCreatePin(tries+1, name); return; }
    setBusy(false,'');
    localStorage.setItem('pb_lastName', name);
    localStorage.setItem('pb_avatar', JSON.stringify({emoji:draftEmoji, color:draftColor}));
    enterRoom(pin, name, keyFor(name));
  });

function handleConfirmJoin(){
  const nameInput = document.getElementById('name-input');
  const name = (nameInput ? nameInput.value : '').trim();
  const pinInput = document.getElementById('pin-input');
  const pin = pinLocked ? draftPin : ((pinInput ? pinInput.value : '').trim());
  const err = document.getElementById('join-error');
  if (!name){ if (err) err.textContent = 'Choisis un prénom.'; return; }
  if (!/^\d{4}$/.test(pin)){ if (err) err.textContent = 'Code à 4 chiffres.'; return; }
  if (err) err.textContent = '';
  setBusy(true, 'Connexion…');
  const ref = db.ref('games/' + pin);
  ref.once('value').then(function(snap){
    if (!snap.exists()){
      setBusy(false,'');
      if (err) err.textContent = 'Code introuvable.';
      return;
    }
    const key = keyFor(name);
    ref.child('players').child(key).transaction(function(current){
      if (current === null) return { name: name, emoji: draftEmoji, color: draftColor };
      if (current.name && normalize(current.name) === normalize(name)) return { name: name, emoji: draftEmoji, color: draftColor };
      return;
    }, function(txErr, committed){
      setBusy(false,'');
      if (txErr){ showToast('Erreur.'); return; }
      if (!committed){ if (err) err.textContent = 'Ce prénom est déjà pris dans cette partie.'; return; }
      localStorage.setItem('pb_lastName', name);
      localStorage.setItem('pb_avatar', JSON.stringify({emoji:draftEmoji, color:draftColor}));
      enterRoom(pin, name, key);
    });
  }).catch(function(){ setBusy(false,''); showToast('Erreur de connexion.'); });
}

/* ---------- room lifecycle ---------- */
function enterRoom(pin, name, key){
  currentPin = pin;
  myName = name; myKey = key;
  localStorage.setItem('pb_identity_' + pin, JSON.stringify({name:name, key:key}));
  history.replaceState(null, '', '?pin=' + pin);
  detachHomeListener();
  hasRenderedOnce = false;
  lastPhase = null;
  hasAutoSubmitted = false;
  locked = false;
  localAnswers = {};
  uiScreen = 'room';
  attachRoomListener(pin);
}
function attachRoomListener(pin){
  if (roomRef) roomRef.off();
  roomRef = db.ref('games/' + pin);
  roomRef.on('value', roomSnapshotHandler, function(){
    showToast('Connexion à la partie impossible.');
  });
}
function detachRoomListener(){
  if (roomRef){ roomRef.off(); roomRef = null; }
}
function goHome(){
  detachRoomListener();
  currentPin = null; myKey = ''; myName = '';
  history.replaceState(null, '', location.pathname);
  uiScreen = 'home';
  attachHomeListener();
  renderTop();
}
function roomSnapshotHandler(snap){
  const val = snap.val();
  if (val === null){
    if (uiScreen === 'room'){ showToast('Cette partie a été fermée.'); goHome(); }
    return;
  }
  state = {
    hostName: val.hostName || '',
    public: !!val.public,
    categories: val.categories || DEFAULT_CATEGORIES,
    roundDurationMs: val.roundDurationMs || 90000,
    players: val.players || {},
    currentRound: val.currentRound || null,
    history: val.history || {},
    ready: val.ready || {}
  };
  const phase = getPhase(state);
  if (!hasRenderedOnce || phase !== 'playing'){ renderTop(); }
  if (!hasRenderedOnce && state.currentRound){
    cleanupOldRoundStorage(currentPin, state.currentRound.number);
    const draft = sessionStorage.getItem(draftKey(currentPin, state.currentRound.number));
    if (draft){ try { localAnswers = JSON.parse(draft); } catch(e){} }
    locked = sessionStorage.getItem(lockedKey(currentPin, state.currentRound.number)) === '1';
  }
  if (!hasRenderedOnce) attemptPendingSubmit();
  hasRenderedOnce = true;
}

function renderRevealContent(s){
  const round = s.currentRound;
  const keys = Object.keys(s.players);
  const res = scoreRound(round, keys, s.categories);
  const answers = round.answers || {};
  const answeredCount = keys.filter(function(k){ return !!answers[k]; }).length;
  const waiting = answeredCount < keys.length;
  const maxScore = keys.reduce(function(m,k){ return Math.max(m, res.totals[k]||0); }, 0);
  const winners = keys.filter(function(k){ return maxScore > 0 && (res.totals[k]||0) === maxScore; });
  let html = '<div class="hero"><div class="letter-badge small">'+esc(round.letter)+'</div>' +
    '<p class="section-title">Résultats · manche '+round.number+'</p></div>';
  if (winners.length && winners.length < keys.length){
    html += '<p class="mvp-banner">🏆 '+winners.map(function(k){ return esc(s.players[k].name); }).join(' & ')+' rafle'+(winners.length>1?'nt':'')+' la manche</p>';
  }
  if (waiting) html += '<p class="muted" style="text-align:center">En attente des réponses ('+answeredCount+'/'+keys.length+')…</p>';
  html += s.categories.map(function(cat){
    const inner = keys.map(function(k){
      const raw = (answers[k] && answers[k][cat]) || '';
      const pts = res.perCat[k][cat];
      const cls = !raw ? 'empty' : (pts===10?'unique':(pts===5?'dup':'invalid'));
      const word = raw ? esc(raw) : 'pas de réponse';
      return '<span class="answer-chip '+cls+'">' + playerAvatarHtml(s.players[k], 'small') + '<span class="word">'+word+'</span><span class="pts">'+(pts?('+'+pts):'0')+'</span></span>';
    }).join('');
    return '<div class="reveal-card"><h3>'+esc(cat)+'</h3><div class="answer-chips">'+inner+'</div></div>';
  }).join('');
  html += '<p class="legend muted">10 pts réponse unique · 5 pts en double · 0 pt invalide ou vide</p>';
  return html;
}

  return '<button type="button" class="cta" data-action="next-round">🔄 Manche suivante</button>';
}

/* ---------- scoreboard ---------- */
function renderScoreboard(s){
  const keys = Object.keys(s.players);
  if (!keys.length) return '';
  const totals = cumulativeTotals(s);
  const sorted = keys.slice().sort(function(a,b){ return (totals[b]||0)-(totals[a]||0); });
  const max = sorted.length ? (totals[sorted[0]]||0) : 0;
  return sorted.map(function(k){
    const lead = (totals[k]===max && max>0) ? ' lead' : '';
    const p = s.players[k];
    return '<div class="player-pill'+lead+'">' + playerAvatarHtml(p) + '<span class="name">'+esc(p.name)+(k===myKey?' (toi)':'')+'</span><span class="score">'+(totals[k]||0)+'</span></div>';
  }).join('');
}

/* ---------- ticking UI ---------- */
function updateTimerUI(){
  if (!state.currentRound) return;
  const totalSec = Math.max(1, Math.round((state.roundDurationMs||90000)/1000));
  const remain = Math.max(0, Math.ceil((state.currentRound.endTime - Date.now())/1000));
  const label = document.getElementById('timer-display');
  if (label) label.textContent = formatTime(remain);
  const ring = document.getElementById('ring-fg');
  if (ring){
    const frac = Math.max(0, Math.min(1, remain/totalSec));
    ring.style.strokeDashoffset = (RING_CIRC * (1-frac)).toFixed(1);
    ring.classList.toggle('danger', remain <= 10);
  }
}
function updateCountdownUI(){
  if (!state.currentRound) return;
  const secs = Math.max(0, Math.ceil((state.currentRound.revealAt - Date.now())/1000));
  const el = document.getElementById('countdown-number');
  if (!el) return;
  const label = secs > 0 ? String(secs) : 'GO !';
  if (label !== lastCountdownLabel){
    lastCountdownLabel = label;
    el.textContent = label;
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }
}

/* ---------- top-level render dispatcher ---------- */
function renderTop(){
  const backVisible = (uiScreen === 'create' || uiScreen === 'join');
  document.getElementById('back-btn').hidden = !backVisible;
  const inRoom = uiScreen === 'room';
  document.getElementById('menu-btn').hidden = !inRoom;
  document.getElementById('scoreboard-strip').innerHTML = inRoom ? renderScoreboard(state) : '';

  const activeEl = document.activeElement;
  const preserveId = (activeEl && activeEl.id) || null;
  const preserveVal = (preserveId && 'value' in activeEl) ? activeEl.value : null;

  let contentHtml = '', bottomHtml = '';
  if (uiScreen === 'home'){
    contentHtml = renderHomeContent();
  } else if (uiScreen === 'create'){
    contentHtml = renderCreateContent();
    bottomHtml = '<button type="submit" form="create-form" class="cta">Créer 🎲</button>';
  } else if (uiScreen === 'join'){
    contentHtml = renderJoinContent();
    bottomHtml = '<button type="submit" form="join-form" class="cta">Rejoindre</button>';
  } else if (uiScreen === 'room'){
    const phase = getPhase(state);
    lastPhase = phase;
    if (phase !== 'countdown') lastCountdownLabel = null;
    if (phase === 'lobby'){ contentHtml = renderLobbyContent(state); bottomHtml = renderLobbyBottom(); }
    else if (phase === 'countdown'){ contentHtml = renderCountdownContent(); bottomHtml = ''; }
    else if (phase === 'playing'){ contentHtml = renderPlayingContent(state); bottomHtml = renderPlayingBottom(); }
    else { contentHtml = renderRevealContent(state); bottomHtml = renderRevealBottom(); }
  }
  document.getElementById('content').innerHTML = contentHtml;
  document.getElementById('bottom-bar').innerHTML = bottomHtml;

  if (preserveId && preserveVal !== null){
    const el = document.getElementById(preserveId);
    if (el){ el.value = preserveVal; el.focus(); }
  }
  if (uiScreen === 'home') renderPublicGamesList();
  if (uiScreen === 'room'){
    const phase = getPhase(state);
    if (phase === 'playing') updateTimerUI();
    if (phase === 'countdown') updateCountdownUI();
    if (phase === 'lobby') renderQr();
  }
  document.title = (uiScreen === 'room' && currentPin) ? ('Petit Bac · #'+currentPin) : 'Petit Bac';
}
function setBusy(isBusy, label){
  const el = document.getElementById('status-line');
  if (el){
    if (label) el.textContent = label;
    el.classList.toggle('show', isBusy && !!label);
  }
  document.querySelectorAll('.cta, .icon-btn, .btn-link').forEach(function(b){ if (isBusy) b.disabled = true; });
}
function showToast(msg){
  const el = document.getElementById('status-line');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ if (el.textContent === msg) el.classList.remove('show'); }, 3500);
}
function draftKey(pin, n){ return 'pb_draft_' + pin + '_' + n; }
function lockedKey(pin, n){ return 'pb_locked_' + pin + '_' + n; }
function pendingKey(pin, n){ return 'pb_pending_' + pin + '_' + n; }
function cleanupOldRoundStorage(pin, currentNumber){
  for (let i = sessionStorage.length - 1; i >= 0; i--){
    const key = sessionStorage.key(i);
    if (!key) continue;
    const m = key.match(/^pb_(draft|locked|pending)_(\d{4})_(\d+)$/);
    if (m && !(m[2] === pin && parseInt(m[3],10) === currentNumber)) sessionStorage.removeItem(key);
  }
}

/* ---------- room actions ---------- */
function handleToggleReady(){
  if (!myKey || !roomRef) return;
  const isReady = !!(state.ready && state.ready[myKey]);
  roomRef.child('ready/' + myKey).set(!isReady);
}
function handleStartRound(){
  if (!roomRef) return;
  setBusy(true, 'Lancement…');
  const used = historyList(state).map(function(r){ return r.letter; });
  const letter = pickLetter(used);
  const number = historyList(state).length + 1;
  const revealAt = Date.now() + COUNTDOWN_MS;
  roomRef.update({
    currentRound: { number: number, letter: letter, revealAt: revealAt, endTime: revealAt + (state.roundDurationMs || 90000) },
    ready: null
  }).then(function(){ setBusy(false,''); }).catch(function(){ setBusy(false,''); showToast('Erreur, réessaie.'); });
}
function handleNextRound(){
  if (!roomRef) return;
  setBusy(true, 'Manche suivante…');
  const round = state.currentRound;
  const historyArr = historyList(state).concat([round]);
  const used = historyArr.map(function(r){ return r.letter; });
  const letter = pickLetter(used);
  const revealAt = Date.now() + COUNTDOWN_MS;
  const updates = {};
  updates['history/' + round.number] = round;
  updates['currentRound'] = { number: round.number + 1, letter: letter, revealAt: revealAt, endTime: revealAt + (state.roundDurationMs || 90000) };
  roomRef.update(updates).then(function(){ setBusy(false,''); }).catch(function(){ setBusy(false,''); showToast('Erreur, réessaie.'); });
}
function handleResetScores(){
  if (!roomRef) return;
  if (!confirm('Remettre les scores à zéro et repartir de la salle d’attente ?')) return;
  setBusy(true, '…');
  roomRef.update({ history: null, currentRound: null, ready: null }).then(function(){ setBusy(false,''); closeSheet(); }).catch(function(){ setBusy(false,''); showToast('Erreur.'); });
}
function handleLeaveRoom(){
  if (currentPin) localStorage.removeItem('pb_identity_' + currentPin);
  closeSheet();
  goHome();
}
function handleLockAnswers(){
  document.querySelectorAll('.answer-input').forEach(function(inp){ localAnswers[inp.dataset.cat] = inp.value; });
  locked = true;
  if (state.currentRound) sessionStorage.setItem(lockedKey(currentPin, state.currentRound.number), '1');
  renderTop();
}
function handleSaveCategories(){
  const ta = document.getElementById('categories-textarea');
  if (!ta || !roomRef) return;
  const list = ta.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
  if (!list.length) return;
  setBusy(true, 'Enregistrement…');
  roomRef.child('categories').set(list).then(function(){ setBusy(false,''); closeSheet(); }).catch(function(){ setBusy(false,''); showToast('Erreur.'); });
}
function handleSetDuration(ms){
  if (!roomRef) return;
  setBusy(true, '…');
  roomRef.child('roundDurationMs').set(ms).then(function(){ setBusy(false,''); openSheet(); }).catch(function(){ setBusy(false,''); });
}
function maybeAutoSubmit(){
  if (hasAutoSubmitted || !roomRef) return;
  if (!myKey || !state.players[myKey]) return;
  const round = state.currentRound;
  if (!round) return;
  const existing = (round.answers || {})[myKey];
  if (existing){ hasAutoSubmitted = true; return; }
  hasAutoSubmitted = true;
  const answers = {};
  state.categories.forEach(function(cat){ answers[cat] = (localAnswers[cat] || '').trim(); });
  sessionStorage.setItem(pendingKey(currentPin, round.number), JSON.stringify(answers));
  roomRef.child('currentRound/answers/' + myKey).set(answers).then(function(){
    sessionStorage.removeItem(pendingKey(currentPin, round.number));
  }).catch(function(){});
}
function attemptPendingSubmit(){
  if (!state.currentRound || !myKey || !roomRef) return;
  const key = pendingKey(currentPin, state.currentRound.number);
  const pending = sessionStorage.getItem(key);
  if (!pending) return;
  const existing = (state.currentRound.answers || {})[myKey];
  if (existing){ sessionStorage.removeItem(key); hasAutoSubmitted = true; return; }
  let answers = null;
  try { answers = JSON.parse(pending); } catch(e){ answers = null; }
  if (answers){
    hasAutoSubmitted = true;
    roomRef.child('currentRound/answers/' + myKey).set(answers).then(function(){ sessionStorage.removeItem(key); });
  }
}
function tick(){
  if (uiScreen !== 'room') return;
  const phase = getPhase(state);
  if (phase !== lastPhase){ renderTop(); }
  if (phase === 'playing'){ updateTimerUI(); }
  else if (phase === 'countdown'){ updateCountdownUI(); }
  else if (phase === 'reveal' && state.currentRound){ maybeAutoSubmit(); }
}

/* ---------- navigation & events ---------- */
function goCreate(){ draftPublic = true; pinLocked = false; draftPin = ''; detachHomeListener(); uiScreen = 'create'; renderTop(); }
function goJoin(){ pinLocked = false; draftPin = ''; detachHomeListener(); uiScreen = 'join'; renderTop(); }
document.addEventListener('submit', function(e){
  if (e.target && e.target.id === 'create-form'){ e.preventDefault(); handleConfirmCreate(); }
  else if (e.target && e.target.id === 'join-form'){ e.preventDefault(); handleConfirmJoin(); }
});
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'go-create') goCreate();
  else if (action === 'go-join') goJoin();
  else if (action === 'go-home'){ uiScreen = 'home'; attachHomeListener(); renderTop(); }
  else if (action === 'quick-join'){ draftPin = btn.dataset.pin; pinLocked = true; detachHomeListener(); uiScreen = 'join'; renderTop(); }
  else if (action === 'pick-emoji'){ draftEmoji = btn.dataset.emoji; refreshAvatarPicker(); }
  else if (action === 'pick-color'){ draftColor = btn.dataset.color; refreshAvatarPicker(); }
  else if (action === 'set-visibility'){
    draftPublic = btn.dataset.public === '1';
    document.querySelectorAll('.visibility-toggle .cta').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    const hint = document.getElementById('visibility-hint');
    if (hint) hint.textContent = draftPublic ? 'Visible dans la liste pour tout le monde.' : 'Accessible uniquement par code ou QR.';
  }
  else if (action === 'copy-link') handleCopyLink();
  else if (action === 'toggle-ready') handleToggleReady();
  else if (action === 'start-round') handleStartRound();
  else if (action === 'next-round') handleNextRound();
  else if (action === 'lock-answers') handleLockAnswers();
  else if (action === 'save-categories') handleSaveCategories();
  else if (action === 'set-duration') handleSetDuration(parseInt(btn.dataset.ms,10));
  else if (action === 'reset-scores') handleResetScores();
  else if (action === 'leave-room') handleLeaveRoom();
  else if (action === 'open-menu') openSheet();
  else if (action === 'close-menu') closeSheet();
});
document.addEventListener('input', function(e){
  if (e.target && e.target.classList && e.target.classList.contains('answer-input')){
    const cat = e.target.dataset.cat;
    localAnswers[cat] = e.target.value;
    if (state.currentRound) sessionStorage.setItem(draftKey(currentPin, state.currentRound.number), JSON.stringify(localAnswers));
  }
});
db.ref('.info/connected').on('value', function(snap){
  const dot = document.getElementById('conn-dot');
  if (dot) dot.classList.toggle('hidden', !!snap.val());
});
setInterval(tick, 250);

/* ---------- boot ---------- */
(function boot(){
  const params = new URLSearchParams(location.search);
  const pinParam = params.get('pin');
  if (pinParam && /^\d{4}$/.test(pinParam)){
    const stored = localStorage.getItem('pb_identity_' + pinParam);
    if (stored){
      try {
        const idn = JSON.parse(stored);
        currentPin = pinParam; myName = idn.name; myKey = idn.key;
        uiScreen = 'room';
        attachRoomListener(pinParam);
        return;
      } catch(e){}
    }
    draftPin = pinParam;
    pinLocked = true;
    uiScreen = 'join';
    renderTop();
    return;
  }
  uiScreen = 'home';
  attachHomeListener();
  renderTop();
})();
</script>
</body>
